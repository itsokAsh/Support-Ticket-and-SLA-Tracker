enum Priority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum TicketStatus {
  OPEN
  IN_PROGRESS
  RESOLVED
  CLOSED
}

enum SLAState {
  ON_TRACK
  AT_RISK
  BREACHED
}

type SLAInfo {
  firstResponseDueAt: String!
  resolutionDueAt: String!
  firstResponseState: SLAState!
  resolutionState: SLAState!
  firstResponseRemainingMinutes: Int!
  resolutionRemainingMinutes: Int!
}

type Ticket {
  id: ID!
  title: String!
  description: String!
  priority: Priority!
  status: TicketStatus!
  reporter: User!
  assignee: User
  createdAt: String!
  updatedAt: String!
  firstResponseAt: String
  resolvedAt: String
  sla: SLAInfo!
  comments: [Comment!]!
}

type Comment {
  id: ID!
  content: String!
  author: User!
  createdAt: String!
}

extend type Mutation {
  """Create a new support ticket."""
  createTicket(
    title: String!
    description: String!
    priority: Priority!
  ): Ticket!

  """Assign a ticket to an agent. Agent-only."""
  assignTicket(
    ticketId: ID!
    assigneeId: ID!
  ): Ticket!

  """Change ticket status. Agent-only. Enforces transition rules."""
  changeTicketStatus(
    ticketId: ID!
    status: TicketStatus!
  ): Ticket!

  """Resolve a ticket. Agent-only. Convenience for changeTicketStatus(RESOLVED)."""
  resolveTicket(
    ticketId: ID!
  ): Ticket!

  """Add a comment to a ticket. If authored by a non-reporter for the first time, freezes firstResponseAt."""
  addComment(
    ticketId: ID!
    content: String!
  ): Ticket!
}
